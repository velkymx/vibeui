name: CI

# Runs the build and full test suite on every push and pull request so the
# README status badge reflects real, current results instead of a hand-typed count.
on:
  push:
    branches: [main, 1.0-main]
  pull_request:
    branches: [main, 1.0-main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test:run

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npm run test:browser

      # The browser suite writes a screenshot for every failed test. Without this the
      # artifacts stay on the runner, so a CI-only failure has to be diagnosed blind.
      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-screenshots
          path: |
            tests/browser/__screenshots__/
            .vitest-attachments/
          if-no-files-found: ignore
          retention-days: 7
